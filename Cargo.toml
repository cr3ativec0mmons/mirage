[package]
name = "mirage"
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "Mirror the screen of Android devices"
repository = "https://github.com/cr3ativec0mmons/mirage"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_8"] }
async-channel = "2.5"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
getrandom = "0.4"
gtk = { package = "gtk4", version = "0.11.5", features = ["gnome_49"] }
mdns-sd = "0.22"
qrcode = { version = "0.14.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
